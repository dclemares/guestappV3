<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vela — Free tours banner · final</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Poppins:wght@400;500;600&display=swap');
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  :root{ --blue:#385bf8; --blue-deep:#1047ff; --navy:#07154d; --grey:#65709a; --grey-soft:#8b95bd; }
  body{ font-family:'Montserrat',sans-serif; color:var(--navy); min-height:100vh; padding:40px 34px 80px;
    background:radial-gradient(circle 260px at 300px 180px, rgba(79,107,255,.18), rgba(79,107,255,0) 72%), linear-gradient(160deg,#e9eefc 0%,#f4f6f9 60%,#eef0f7 100%); background-attachment:fixed; }
  .page-h{ max-width:1100px; margin:0 auto 28px; }
  .page-h .kick{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); }
  .page-h h1{ margin:6px 0 4px; font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .page-h p{ margin:0; font-family:'Poppins',sans-serif; font-size:14px; color:var(--grey); max-width:700px; }
  .row{ display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap; max-width:1100px; margin:0 auto; }
  .item{ width:360px; }
  .item .label{ display:block; margin:0 0 10px; font-size:12.5px; font-weight:800; }
  .item .label small{ display:block; margin-top:2px; font-family:'Poppins',sans-serif; font-weight:500; font-size:11.5px; color:var(--grey); }
  .item .tag{ display:inline-flex; height:20px; align-items:center; padding:0 8px; border-radius:999px; font-size:10px; font-weight:800; background:var(--blue); color:#fff; margin-bottom:8px; letter-spacing:.04em; }
  .stage{ width:345px; padding:14px; border-radius:18px; background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8); box-shadow:0 14px 36px rgba(22,40,90,.10); }

  /* ===== final banner (BP6 base, photo BP1, no colour gradient) ===== */
  .fb{ position:relative; width:100%; height:96px; border-radius:14px; overflow:hidden; color:#fff;
    background:url(landingV1/assets/deals/madrid4.jpg) center 30% / cover; }
  .fb .tint{ position:absolute; inset:0; background:rgba(8,12,30,.26); z-index:1; }      /* flat tint for legibility, not a gradient */
  .fb .ct{ position:relative; z-index:2; height:100%; padding:15px 16px; display:flex; flex-direction:column; justify-content:center; }
  .fb .kik{ font-size:8.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.95; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .fb b{ font-size:19px; font-weight:900; letter-spacing:-.02em; line-height:1.08; margin-top:3px; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .fb .arrow{ display:inline-flex; align-items:center; gap:6px; margin-top:9px; font-size:12px; font-weight:800; text-shadow:0 1px 8px rgba(0,0,0,.5); }
  .fb .arrow svg{ width:15px; height:15px; stroke-width:2.6; }
  .fb .spon{ position:absolute; right:14px; bottom:8px; font-size:7.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; opacity:.8; z-index:3; text-shadow:0 1px 4px rgba(0,0,0,.6); }

  /* ===== sticker variants ===== */
  /* A · round seal (amber) */
  .stk-a{ position:absolute; right:15px; top:50%; transform:translateY(-50%) rotate(9deg); z-index:4;
    width:66px; height:66px; border-radius:50%; background:#ffd24a; color:#3a2a00; border:2.5px solid #fff;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:6px;
    font-size:10px; font-weight:900; line-height:1.08; box-shadow:0 8px 18px rgba(0,0,0,.32); }

  /* B · tag pill (white, rotated) */
  .stk-b{ position:absolute; right:16px; top:14px; transform:rotate(-5deg); z-index:4;
    display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 12px 0 10px; border-radius:999px;
    background:#fff; color:#d23e57; font-size:11px; font-weight:900; box-shadow:0 7px 16px rgba(0,0,0,.28); }
  .stk-b::before{ content:''; width:7px; height:7px; border-radius:50%; background:#d23e57; box-shadow:0 0 0 3px rgba(210,62,87,.18); }

  /* C · starburst seal (coral) */
  .stk-c{ position:absolute; right:14px; top:50%; transform:translateY(-50%) rotate(-6deg); z-index:4;
    width:70px; height:70px; color:#fff; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:10px; font-weight:900; line-height:1.06; filter:drop-shadow(0 7px 14px rgba(0,0,0,.3)); }
  .stk-c::before{ content:''; position:absolute; inset:0; background:#ff4c5c;
    clip-path:polygon(50% 0,61% 12%,76% 6%,79% 23%,95% 25%,90% 41%,100% 50%,90% 59%,95% 75%,79% 77%,76% 94%,61% 88%,50% 100%,39% 88%,24% 94%,21% 77%,5% 75%,10% 59%,0 50%,10% 41%,5% 25%,21% 23%,24% 6%,39% 12%); }
  .stk-c span{ position:relative; z-index:2; }
</style>
</head>
<body>
  <div class="page-h">
    <div class="kick">Vela · sponsored · free tours · final</div>
    <h1>Free tours banner — pick the sticker</h1>
    <p>BP6 base · BP1 photo (Gran Via) · no color gradient (only a light flat tint for legibility) · text “Discover Madrid with local guides” · sticker “Join for free”. Three sticker styles:</p>
  </div>

  <div class="row" id="row"></div>

<script>
  var ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function base(sticker){
    return '<div class="fb"><div class="tint"></div>'+sticker+
      '<div class="ct"><span class="kik">Free walking tours</span>'+
      '<b>Discover Madrid<br>with local guides</b>'+
      '<span class="arrow">Book tour '+ARR+'</span></div>'+
      '<span class="spon">Sponsored</span></div>';
  }
  var A=base('<span class="stk-a">JOIN<br>FREE</span>');
  var B=base('<span class="stk-b">Join for free</span>');
  var C=base('<span class="stk-c"><span>JOIN<br>FREE</span></span>');

  var items=[
    {tag:'A', name:'Round seal · amber', desc:'Amber round seal with white border, slightly rotated. Feels like a badge/sticker.', html:A},
    {tag:'B', name:'Tag pill · white', desc:'Etiqueta blanca tipo pegatina con puntito, girada. Limpia y discreta.', html:B},
    {tag:'C', name:'Starburst · coral', desc:'Coral starburst sticker, very offer-like. Very attention-grabbing.', html:C}
  ];
  document.getElementById('row').innerHTML = items.map(function(it){
    return '<div class="item"><span class="tag">Sticker '+it.tag+'</span><div class="label">'+it.name+'<small>'+it.desc+'</small></div><div class="stage">'+it.html+'</div></div>';
  }).join('');
</script>
</body>
</html>
