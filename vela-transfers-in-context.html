<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vela — Transfers en contexto (TB1–TB4)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap');
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:'Montserrat',sans-serif; }
  body{ display:flex; flex-direction:column; background:#0c1020; }
  .bar{ flex:none; display:flex; align-items:center; gap:14px; padding:11px 18px; background:#0c1020; color:#fff; }
  .bar .ttl{ font-size:13px; font-weight:800; letter-spacing:-.01em; }
  .bar .ttl small{ display:block; font-weight:600; font-size:10.5px; opacity:.6; letter-spacing:.02em; }
  .bar .sp{ flex:1; }
  .bar button{ border:0; cursor:pointer; font:inherit; font-weight:800; font-size:12px; color:#cdd6ff; background:rgba(255,255,255,.08); padding:8px 14px; border-radius:9px; transition:background .18s, color .18s, transform .15s; }
  .bar button:hover{ transform:translateY(-1px); background:rgba(255,255,255,.16); }
  .bar button.on{ background:#fff; color:#10142b; }
  .bar button b{ display:block; font-size:9px; font-weight:600; opacity:.6; margin-top:1px; }
  .bar button.on b{ opacity:.55; }
  .stage{ flex:1; min-height:0; background:#10142b; }
  iframe{ width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
  <div class="bar">
    <div class="ttl">Vela · Transfers en contexto<small>Pulsa una opción para cambiar el banner dentro del landing real</small></div>
    <div class="sp"></div>
    <button data-v="1" class="on">TB1<b>Foto editorial</b></button>
    <button data-v="2">TB2<b>Bloque + coche</b></button>
    <button data-v="3">TB3<b>Tira de mapa</b></button>
    <button data-v="4">TB4<b>Hero oscuro</b></button>
  </div>
  <div class="stage"><iframe id="fr" src="landingV1/index-v2.html"></iframe></div>

<script>
  var IMG='assets/deals/transfer.jpg';
  var CSS=`
  #tbwrap{ margin:30px 0 10px; }
  #tbwrap .bn{ position:relative; width:100%; border-radius:14px; overflow:hidden; color:#fff; box-shadow:0 10px 24px rgba(23,42,96,.16); font-family:'Montserrat',sans-serif; }
  #tbwrap .bn .link{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; }
  #tbwrap .bn .link svg{ width:13px; height:13px; stroke-width:2.4; }
  #tbwrap .btn{ border:0; cursor:pointer; font:inherit; font-weight:800; border-radius:9px; display:inline-flex; align-items:center; gap:6px; }
  #tbwrap .btn svg{ width:13px; height:13px; stroke-width:2.4; }
  #tbwrap .spon{ position:absolute; z-index:5; font-size:7.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  #tbwrap .tb1{ height:96px; background:url(${IMG}) center 55% / cover; }
  #tbwrap .tb1 .tint{ position:absolute; inset:0; background:rgba(8,12,30,.34); }
  #tbwrap .tb1 .in{ position:absolute; inset:0; z-index:3; padding:0 76px 0 16px; display:flex; flex-direction:column; justify-content:center; }
  #tbwrap .tb1 .kik{ font-size:8px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; opacity:.95; text-shadow:0 1px 5px rgba(0,0,0,.5); }
  #tbwrap .tb1 b{ font-size:14.5px; font-weight:900; line-height:1.12; letter-spacing:-.02em; margin-top:3px; text-shadow:0 2px 10px rgba(0,0,0,.5); max-width:185px; }
  #tbwrap .tb1 .link{ margin-top:6px; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  #tbwrap .tb1 .spon{ right:13px; bottom:8px; color:#fff; opacity:.8; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  #tbwrap .tb1 .star{ position:absolute; right:13px; top:50%; transform:translateY(-50%) rotate(-6deg); z-index:4; width:58px; height:58px; color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; font-size:10px; font-weight:900; line-height:1.04; filter:drop-shadow(0 7px 13px rgba(0,0,0,.3)); }
  #tbwrap .tb1 .star::before{ content:''; position:absolute; inset:0; background:#ff4c5c; clip-path:polygon(50% 0,61% 12%,76% 6%,79% 23%,95% 25%,90% 41%,100% 50%,90% 59%,95% 75%,79% 77%,76% 94%,61% 88%,50% 100%,39% 88%,24% 94%,21% 77%,5% 75%,10% 59%,0 50%,10% 41%,5% 25%,21% 23%,24% 6%,39% 12%); }
  #tbwrap .tb1 .star span{ position:relative; z-index:2; }
  #tbwrap .tb2{ height:104px; background:linear-gradient(120deg,#2b46d8,#4f6bff 60%,#6f86ff); }
  #tbwrap .tb2 .car{ position:absolute; right:-18px; bottom:-6px; width:168px; height:104px; background:url(${IMG}) center / cover; -webkit-mask-image:linear-gradient(90deg, transparent, #000 38%); mask-image:linear-gradient(90deg, transparent, #000 38%); opacity:.92; }
  #tbwrap .tb2 .in{ position:absolute; inset:0; z-index:3; padding:13px 15px; display:flex; flex-direction:column; }
  #tbwrap .tb2 .pill{ align-self:flex-start; height:20px; display:inline-flex; align-items:center; gap:5px; padding:0 9px; border-radius:999px; background:#ffd24a; color:#3a2a00; font-size:9px; font-weight:900; letter-spacing:.03em; text-transform:uppercase; }
  #tbwrap .tb2 b{ font-size:15px; font-weight:900; line-height:1.12; letter-spacing:-.02em; margin:7px 0 0; max-width:185px; text-shadow:0 2px 8px rgba(0,0,0,.2); }
  #tbwrap .tb2 .chips{ display:flex; gap:6px; margin-top:auto; }
  #tbwrap .tb2 .chip{ height:18px; display:inline-flex; align-items:center; padding:0 8px; border-radius:999px; background:rgba(255,255,255,.18); font-size:8.5px; font-weight:700; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  #tbwrap .tb2 .spon{ right:12px; top:11px; color:#fff; opacity:.85; }
  #tbwrap .tb3{ height:96px; display:flex; background:#fff; color:#07154d; }
  #tbwrap .tb3 .mapwrap{ position:relative; width:128px; flex:none; }
  #tbwrap .tb3 .map{ display:block; width:100%; height:100%; }
  #tbwrap .tb3 .body{ flex:1; min-width:0; padding:12px 14px 12px 13px; display:flex; flex-direction:column; justify-content:center; }
  #tbwrap .tb3 .kik{ font-size:8px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#385bf8; }
  #tbwrap .tb3 b{ font-size:13.5px; font-weight:800; letter-spacing:-.01em; margin-top:2px; }
  #tbwrap .tb3 .pay{ display:flex; align-items:baseline; gap:6px; margin-top:3px; }
  #tbwrap .tb3 .pay b{ font-size:16px; } #tbwrap .tb3 .pay span{ font-size:9.5px; font-weight:700; color:#0f9f80; background:rgba(15,159,128,.1); padding:2px 6px; border-radius:6px; }
  #tbwrap .tb3 .btn{ align-self:flex-start; margin-top:9px; height:30px; padding:0 14px; background:#10142b; color:#fff; font-size:11px; }
  #tbwrap .tb3 .spon{ left:8px; top:8px; right:auto; color:#fff; background:rgba(16,20,43,.5); padding:2px 5px; border-radius:5px; }
  #tbwrap .tb4{ height:104px; background:#0c1020; }
  #tbwrap .tb4 .ph{ position:absolute; inset:0; background:url(${IMG}) right center / cover; }
  #tbwrap .tb4 .ph::after{ content:''; position:absolute; inset:0; background:linear-gradient(100deg, rgba(8,11,26,.96) 38%, rgba(8,11,26,.55) 64%, rgba(8,11,26,.2)); }
  #tbwrap .tb4 .in{ position:absolute; inset:0; z-index:3; padding:13px 15px; display:flex; flex-direction:column; justify-content:center; }
  #tbwrap .tb4 .kik{ font-size:8px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:#9fb0ff; }
  #tbwrap .tb4 b{ font-size:14.5px; font-weight:900; line-height:1.14; letter-spacing:-.02em; margin-top:3px; max-width:175px; }
  #tbwrap .tb4 .foot{ display:flex; align-items:center; gap:10px; margin-top:9px; }
  #tbwrap .tb4 .price{ font-size:9.5px; font-weight:600; opacity:.85; } #tbwrap .tb4 .price b{ display:inline; font-size:15px; font-weight:900; opacity:1; margin-left:3px; }
  #tbwrap .tb4 .btn{ margin-left:auto; height:30px; padding:0 15px; background:#fff; color:#10142b; font-size:11px; }
  #tbwrap .tb4 .spon{ right:13px; top:11px; color:#fff; opacity:.7; }`;

  var ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var MAP='<svg class="map" viewBox="0 0 128 96" preserveAspectRatio="xMidYMid slice"><rect width="128" height="96" fill="#e8eef8"/><g fill="#dde6f5"><rect x="8" y="8" width="40" height="26" rx="4"/><rect x="60" y="6" width="40" height="22" rx="4"/><rect x="10" y="58" width="44" height="30" rx="4"/><rect x="70" y="56" width="50" height="34" rx="4"/></g><g stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"><path d="M0 46 H128"/><path d="M56 0 V96"/></g><path d="M22 78 C 56 72, 56 40, 104 30" stroke="#385bf8" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="22" cy="78" r="6.5" fill="#385bf8" stroke="#fff" stroke-width="2.5"/><g transform="translate(104,30)"><path d="M0 -13 C 7 -13 11 -7 11 -1 C 11 6 0 15 0 15 C 0 15 -11 6 -11 -1 C -11 -7 -7 -13 0 -13Z" fill="#10142b" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-1" r="3.6" fill="#fff"/></g></svg>';
  var V={
    1:'<div class="bn tb1"><div class="tint"></div><span class="spon">Patrocinado</span><span class="star"><span>&minus;20%</span></span><div class="in"><span class="kik">Traslados &middot; aeropuerto y ciudad</span><b>Llega al aeropuerto sin estr&eacute;s</b><span class="link">Reservar '+ARR+'</span></div></div>',
    2:'<div class="bn tb2"><span class="car"></span><span class="spon">Patrocinado</span><div class="in"><span class="pill">&#128293; Oferta especial</span><b>Traslados aeropuerto y ciudad</b><div class="chips"><span class="chip">Cancelaci&oacute;n gratis</span><span class="chip">Asistencia 24/7</span></div></div></div>',
    3:'<div class="bn tb3"><div class="mapwrap">'+MAP+'</div><div class="body"><span class="kik">Traslado puerta a puerta</span><div class="pay"><b>desde 28&euro;</b><span>Precio fijo</span></div><button class="btn">Reservar traslado '+ARR+'</button></div><span class="spon">Patrocinado</span></div>',
    4:'<div class="bn tb4"><div class="ph"></div><span class="spon">Patrocinado</span><div class="in"><span class="kik">Traslado privado</span><b>Tu coche al aeropuerto</b><div class="foot"><span class="price">desde<b>28&euro;</b></span><button class="btn">Reservar '+ARR+'</button></div></div></div>'
  };

  var fr=document.getElementById('fr');
  var current=1;

  function ensureSetup(doc){
    if(!doc.getElementById('tbDemoCSS')){
      var st=doc.createElement('style'); st.id='tbDemoCSS'; st.textContent=CSS; doc.head.appendChild(st);
    }
    var promo=doc.querySelector('chekin-vela .vela-promo');
    if(promo){
      var wrap=doc.createElement('div'); wrap.id='tbwrap';
      promo.parentNode.replaceChild(wrap, promo);
    }
    return !!doc.getElementById('tbwrap');
  }

  function apply(n){
    current=n;
    var doc=fr.contentDocument;
    if(!doc) return;
    var wrap=doc.getElementById('tbwrap') ? doc.getElementById('tbwrap') : (ensureSetup(doc), doc.getElementById('tbwrap'));
    if(!wrap) return;
    wrap.innerHTML=V[n];
    wrap.scrollIntoView({block:'center'});
    Array.prototype.forEach.call(document.querySelectorAll('.bar button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-v')==String(n));
    });
  }

  // The chekin-vela component renders after its script loads (defer). Poll until the promo exists.
  function waitAndApply(){
    var doc=fr.contentDocument;
    if(doc && (doc.querySelector('chekin-vela .vela-promo') || doc.getElementById('tbwrap'))){
      ensureSetup(doc);
      apply(current);
    } else {
      setTimeout(waitAndApply, 120);
    }
  }
  fr.addEventListener('load', function(){ setTimeout(waitAndApply, 150); });

  Array.prototype.forEach.call(document.querySelectorAll('.bar button'), function(b){
    b.addEventListener('click', function(){ apply(Number(b.getAttribute('data-v'))); });
  });
</script>
</body>
</html>
