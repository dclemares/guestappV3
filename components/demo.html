<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chekin components — demo</title>
  <script src="./chekin-navbar.js?v=warning-badges" defer></script>
  <script src="./chekin-booking-card.js?v=booking-card-checkout-space-guard" defer></script>
  <script src="./chekin-vela.js?v=vela-components-12" defer></script>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Montserrat',sans-serif; color:#07154d;
    background:radial-gradient(circle 260px at 300px 180px, rgba(79,107,255,.20), rgba(79,107,255,0) 72%),
      linear-gradient(160deg,#e9eefc 0%,#f4f6f9 60%,#eef0f7 100%);
    background-attachment:fixed; min-height:100vh; }
  .main{ margin-left:288px; margin-right:380px; padding:48px 56px 96px; }
  h1{ font-size:34px; font-weight:800; letter-spacing:0; }
  .component-stack{ display:flex; flex-direction:column; gap:28px; }
  @media (max-width:1279px){ .main{ margin-right:0; } }
  @media (max-width:767px){ .main{ margin-left:0; padding:28px 20px; } }
</style>
</head>
<body>
  <chekin-navbar active="registration"></chekin-navbar>

  <main class="main">
    <div class="component-stack">
      <div>
        <h1>Component demo</h1>
        <p>The navbar, booking card and Vela panel are rendered entirely by the reusable components.</p>
      </div>
      <chekin-booking-card status="locked"></chekin-booking-card>
      <chekin-booking-card status="separated"></chekin-booking-card>
      <chekin-booking-card status="digital-key"></chekin-booking-card>
    </div>
  </main>

  <chekin-vela flat-text
    intro="I can help you fill in your details, explain why each field is needed, and get you checked in faster."
    reco-title="">
    <script type="application/json">
    [
      {"type":"section","label":"Smart tips","tone":"amber"},
      {"chip":"Tip","reason":"Faster check-in","strong":"Use your passport","text":"Pick the same document you'll show on arrival to avoid delays."},
      {"type":"section","label":"Quick actions","tone":"green"},
      {"type":"capsule","icon":"users","title":"Change guest count"},
      {"type":"capsule","icon":"share","title":"Share booking link"},
      {"type":"section","label":"Offers for your stay","tone":"blue","sub":"Picked for your trip — small extras to make check-in smoother."},
      {"type":"deals-carousel","deals":[
        {"img":"../landingV1/assets/deals/room.jpg","title":"Early check-in","sub":"Access from 11:00","price":"€25","save":"-30%"},
        {"img":"../landingV1/assets/deals/transfer.jpg","title":"Airport transfer","sub":"Direct ride","price":"€45"},
        {"img":"../landingV1/assets/deals/parking.jpg","title":"Parking spot","sub":"On-site, per night","price":"€15"}
      ]},
      {"type":"deal-hero","img":"../landingV1/assets/deals/room.jpg","title":"Early check-in","sub":"Access from 11:00","price":"€25","old":"€35","save":"-30%"},
      {"type":"deal","icon":"car","title":"Airport transfer","sub":"Direct ride","price":"€45"},
      {"type":"banner","logo":"airalo","img":"../landingV1/assets/deals/beach.jpg","headline":"Activa tu eSIM, sin roaming","priceLabel":"Desde","price":"4,00€","cta":"Ver planes","tag":"Patrocinado"}
    ]
    </script>
  </chekin-vela>
</body>
</html>
