<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guest App V3 — Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #385bf8;
    --blue-2: #5d7cff;
    --blue-deep: #1047ff;
    --navy: #161643;
    --teal: #35e5bc;
    --grey: #6b6b95;
    --grey-soft: #9696b9;
    --line: #dedeeb;
    --bg: #f4f6f8;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--navy);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(56,91,248,.12), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(53,229,188,.10), transparent 55%),
      var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 28px 80px; }

  header.hero { margin-bottom: 36px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--blue);
    background: rgba(56,91,248,.08);
    border: 1px solid rgba(56,91,248,.18);
    padding: 6px 12px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px rgba(53,229,188,.22); }
  h1 { font-size: 38px; line-height: 1.1; font-weight: 800; margin: 18px 0 10px; letter-spacing: -.02em; }
  h1 .grad {
    background: linear-gradient(145deg, var(--blue-deep) 0%, var(--blue-2) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { font-family: 'Poppins', sans-serif; font-size: 16px; color: var(--grey); max-width: 560px; margin: 0; }

  .list { margin-top: 32px; display: flex; flex-direction: column; gap: 22px; }

  .module {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(22,22,67,.04), 0 12px 30px -22px rgba(22,22,67,.20);
  }
  .module-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line);
  }
  .module-title-row { display: flex; align-items: baseline; gap: 10px; }
  .module-title { font-size: 18px; font-weight: 700; margin: 0; }
  .module-count {
    font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600;
    color: var(--grey-soft); background: #eef0f7; padding: 3px 9px; border-radius: 999px;
  }
  .module-desc { font-family: 'Poppins', sans-serif; font-size: 13.5px; color: var(--grey); margin: 6px 0 0; }

  .versions { list-style: none; margin: 0; padding: 6px; }
  .version {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 12px 16px; border-radius: 12px;
    text-decoration: none; color: inherit;
    transition: background .15s ease;
  }
  .version:hover { background: rgba(56,91,248,.06); }
  .version-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .version-label { font-size: 15px; font-weight: 600; }
  .version-note { font-family: 'Poppins', sans-serif; font-size: 12.5px; color: var(--grey-soft); }
  .version-open {
    flex: none;
    font-size: 13px; font-weight: 700; color: var(--blue);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .version-open .ext { font-size: 11px; opacity: .8; }
  .version:hover .version-open .arrow { transform: translate(2px, -2px); }
  .arrow { transition: transform .15s ease; display: inline-block; }

  .module.soon { opacity: .6; }
  .module.soon .version-open { color: var(--grey-soft); }

  footer { margin-top: 44px; font-family: 'Poppins', sans-serif; font-size: 13px; color: var(--grey-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="kicker"><span class="dot"></span> Local environment · Guest App V3</span>
      <h1>Hub <span class="grad">Guest App V3</span></h1>
      <p class="sub">Product module list. Each module groups its versions; selecting one opens it in a new tab.</p>
    </header>

    <div class="list" id="list"></div>

    <footer>Trabajando en local — sin sincronizar con GitHub.</footer>
  </div>

  <script>
    // To add a version: add an object to the corresponding module's "versions" array.
    // To add a new module: add an object to MODULES with its "versions" array.
    // status: "soon" on a module shows it dimmed (under construction).
    const MODULES = [
      {
        name: "Full flow",
        desc: "Chained journey in a single URL (single view). The URL does not change between screens.",
        versions: [
          { label: "Full flow", note: "Hero · Cinematic → Landing → (Start) Guest Summary → (Add guest) Guest Registration V2", href: "flujo-completo.html" },
          { label: "Full flow · 2", note: "Landing (no tourist tax · index-v2 vela) → (Start) Guest Summary → (Add guest) IV → Form redesign (5b boxed)", href: "flujo-completo-2.html" }
        ]
      },
      {
        name: "Landing",
        desc: "Guest entry screen: check-in journey, registration, and payments.",
        versions: [
          { label: "landingV1", note: "Current Guestapp V3 build", href: "landingV1/" }
        ]
      },
      {
        name: "Guest Registration",
        desc: "\"Add your details\" form in the central area, with navbar and Vela panel. Several visual treatments over the brand style, including the boxed redesigns.",
        versions: [
          { label: "V1 · Cards", note: "Sections in cards with icon header and gradient button", href: "landingV1/registro/v1-cards.html" },
          { label: "V2 · Minimal", note: "Uppercase labels, underline inputs, editorial navy", href: "landingV1/registro/v2-minimal.html" },
          { label: "V3 · Guided", note: "Document scanning, floating labels, and contextual help", href: "landingV1/registro/v3-guided.html" },
          { label: "Redesign · Underline in boxes", note: "Summary-style boxes, underline fields, country-code phone, success modal", href: "landingV1/registro/form-redesign-1-boxed.html" },
          { label: "Redesign · Summary rows in boxes", note: "Summary-style boxes, label/value rows, country-code phone, success modal", href: "landingV1/registro/form-redesign-5-boxed.html" }
        ]
      },
      {
        name: "Identity verification",
        desc: "Focused verification flow: intro, document choice, front/back capture, and facial check. Inside the shell with navbar and Vela panel.",
        versions: [
          { label: "V1 · Identity verification", note: "Verification flow: document, front/back, and face", href: "landingV1/registro/verificacion-identidad.html" },
          { label: "V2 · Guest Registration", note: "Reframed as registration, with a 4th step (form) in progress", href: "landingV1/registro/verificacion-identidad-v2.html" },
          { label: "IV · Use cases", note: "Scenario hub: reading errors, passport (1 capture), no selfie — opens V2 with parameters", href: "iv-casos.html" }
        ]
      },
      {
        name: "Guest Summary",
        desc: "Booking guest summary: responsible guest, accompanying guests, and minors.",
        versions: [
          { label: "Guest Summary", note: "Editable adult and minor list with adapted Vela", href: "landingV1/guest-summary.html" }
        ]
      },
      {
        name: "Animations",
        desc: "Full-screen intro animations and screens for the guest journey.",
        versions: [
          { label: "Hero · Cinematic", note: "Full-bleed cinematic layout with bottom-left text", href: "animations/hero-cinematic.html" }
        ]
      },
      {
        name: "Vela · Components",
        desc: "Vela panel component library: section headers, quick actions, deals (carousel/hero/coupon), contextual deal, and sponsored banner. All implemented in the chekin-vela component.",
        versions: [
          { label: "Component library", note: "Section headers · capsules · deals carousel/hero/coupon · contextual · sponsored banner", href: "vela-components-overview.html" },
          { label: "Landing", note: "Full Vela panel: guidebook + offers (deals carousel) + free tours (promo) + Airalo (banner)", href: "vela-landing.html" },
          { label: "Vela deals only", note: "Vela panel with only deals carousel + free tours (promo) + Airalo (banner)", href: "vela-deals-only.html" }
        ]
      }
    ];

    const list = document.getElementById("list");
    list.innerHTML = MODULES.map(m => {
      const soon = m.status === "soon";
      const count = m.versions.length;
      const countLabel = count === 1 ? "1 version" : count + " versions";

      const rows = count
        ? m.versions.map(v => `
            <li>
              <a class="version" href="${v.href}" target="_blank" rel="noopener">
                <span class="version-main">
                  <span class="version-label">${v.label}</span>
                  ${v.note ? `<span class="version-note">${v.note}</span>` : ""}
                </span>
                <span class="version-open">Open <span class="ext">↗</span><span class="arrow">→</span></span>
              </a>
            </li>`).join("")
        : `<li><div class="version"><span class="version-note">No versions yet</span></div></li>`;

      return `
        <section class="module${soon ? " soon" : ""}">
          <div class="module-head">
            <div class="module-title-row">
              <h2 class="module-title">${m.name}</h2>
              <span class="module-count">${countLabel}</span>
            </div>
            ${m.desc ? `<p class="module-desc">${m.desc}</p>` : ""}
          </div>
          <ul class="versions">${rows}</ul>
        </section>`;
    }).join("");
  </script>
</body>
</html>
